<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WCC Weligollawa Members</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root { --blue: #0d6efd; }

body {
    background: var(--blue);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    color: #fff;
    text-align: center;
    padding: 25px 10px;
}

.members-wrapper {
    background: #f8f9fa;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    flex: 1;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.15);
}

.member-card img {
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 12px;
    border: 3px solid var(--blue);
}

.comment-box { display:none; margin-top: 8px; }

footer {
    text-align: center;
    padding: 12px;
    color: #fff;
    font-size: 14px;
    opacity: .85;
}
</style>
</head>

<body>

<div class="header">
    <h2 class="fw-semibold mb-1">Our Members</h2>
    <p class="mb-0">WCC Weligollawa</p>
</div>

<div class="container members-wrapper">
    <div class="row g-3 justify-content-center" id="membersRow"></div>
</div>

<footer>
© WCC Weligollawa. All Rights Reserved.
</footer>

<script>
const sheetId = "1KpFvhwi-yuo63ZSSQK80My6zM59gk2hHY1HZFk9q1Os";
const sheetName = "Players wcc";
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

let likes = JSON.parse(localStorage.getItem("wccLikes") || "{}");
let comments = JSON.parse(localStorage.getItem("wccComments") || "{}");
let likedAlready = JSON.parse(localStorage.getItem("wccLikedOnce") || "{}");

fetch(url)
.then(res => res.text())
.then(data => {
    const json = JSON.parse(data.substring(47).slice(0, -2));
    const rows = json.table.rows;
    const container = document.getElementById("membersRow");

    rows.forEach((row, i) => {
        const name = row.c[0]?.v;
        const image = row.c[3]?.v;

        if (name && image) {

            if (!likes[i]) likes[i] = 0;
            if (!comments[i]) comments[i] = [];
            if (!likedAlready[i]) likedAlready[i] = false;

            const likedText = likedAlready[i] ? "Liked ✔" : "👍 Like";
            const disabled = likedAlready[i] ? "disabled" : "";

            container.innerHTML += `
<div class="col-10 col-sm-6 col-md-4 col-lg-3 col-xl-2">
<div class="card member-card text-center p-2 border-0 shadow-sm">

<img src="${image}" class="img-fluid mx-auto" alt="${name}">

<div class="card-body p-2">
<h6 class="card-title text-primary fw-semibold mb-1">${name}</h6>

<button id="likeBtn${i}" class="btn btn-sm btn-outline-primary mb-1"
${disabled} onclick="addLike(${i})">${likedText}</button>
<span id="likeCount${i}">${likes[i]}</span> likes

<br>

<button class="btn btn-sm btn-outline-secondary mt-1"
onclick="toggleComments(${i})">💬 Comments</button>

<div id="commentBox${i}" class="comment-box">
<input type="text" id="input${i}" class="form-control form-control-sm mb-1"
placeholder="Write a comment...">
<button class="btn btn-sm btn-success w-100 mb-2"
onclick="addComment(${i})">Post</button>

<div id="commentList${i}" class="small text-start">
${comments[i].map(c => `<div class="border-bottom py-1">• ${c}</div>`).join("")}
</div>
</div>

</div>
</div>
</div>
`;
        }
    });
});

function saveData(){
    localStorage.setItem("wccLikes", JSON.stringify(likes));
    localStorage.setItem("wccComments", JSON.stringify(comments));
    localStorage.setItem("wccLikedOnce", JSON.stringify(likedAlready));
}

function addLike(i){
    if (likedAlready[i]) return;

    likes[i]++;
    likedAlready[i] = true;

    document.getElementById("likeCount"+i).innerText = likes[i];
    const btn = document.getElementById("likeBtn"+i);
    btn.innerText = "Liked ✔";
    btn.disabled = true;

    saveData();
}

function toggleComments(i){
    const box = document.getElementById("commentBox"+i);
    box.style.display = box.style.display === "none" ? "block" : "none";
}

function addComment(i){
    const input = document.getElementById("input"+i);
    const text = input.value.trim();
    if(text === "") return;

    comments[i].push(text);
    input.value = "";

    const list = document.getElementById("commentList"+i);
    list.innerHTML = comments[i]
        .map(c => `<div class="border-bottom py-1">• ${c}</div>`)
        .join("");

    saveData();
}
</script>

</body>
</html>
