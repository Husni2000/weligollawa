<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCC Weligollawa Form</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #4A90E2, #50E3C2);
    padding: 20px;
}

.form-container {
    background: #ffffff;
    width: 100%;
    max-width: 450px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.form-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #1A73E8;
}

.home-link {
    display: block;
    text-align: center;
    margin-bottom: 15px;
    color: #1A73E8;
    text-decoration: none;
    font-weight: bold;
}

.form-container input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.form-container button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #1A73E8;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.form-container button:disabled {
    background: gray;
    cursor: not-allowed;
}

#status {
    text-align: center;
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="form-container">
    <a href="index.html" class="home-link">← Back to Home</a>
    <h2>WCC Weligollawa</h2>

    <form id="myForm">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="number" name="age" placeholder="Age" required>
        <input type="text" name="mobile" placeholder="Mobile Number" required>

        <p id="status">Upload image</p>
        <input type="file" id="imageFile" accept="image/*" required>

        <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div class="info" style="text-align:center; margin-top:15px;">
        Your data will be securely stored. Image upload via URL only.
    </div>
</div>

<script>
const form = document.getElementById('myForm');
const status = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

const scriptURL = 'https://script.google.com/macros/s/AKfycbxLPUgNRjbE_itfbHGfNoVcBId3vPBfgZCJzFIRF7jLxl6tb1vDBZY5iMPX4iJF2rSAHA/exec';
const apiKey = 'd44f105526f939f705e1a96a1700bf7a';

form.addEventListener('submit', async e => {
    e.preventDefault();

    // BLOCK DOUBLE CLICK
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    status.textContent = "Uploading image...";

    const fileInput = document.getElementById('imageFile');
    const file = fileInput.files[0];

    const imgForm = new FormData();
    imgForm.append('image', file);

    const res = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
        method: 'POST',
        body: imgForm
    });

    const data = await res.json();

    if (!data.success) {
        status.textContent = "Image upload failed!";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
        return;
    }

    const imageURL = data.data.url;

    status.textContent = "Sending data to Google Sheet...";

    const sheetData = new FormData();
    sheetData.append('name', form.name.value);
    sheetData.append('age', form.age.value);
    sheetData.append('mobile', form.mobile.value);
    sheetData.append('imageURL', imageURL);

    const sheetRes = await fetch(scriptURL, {
        method: 'POST',
        body: sheetData
    });

    if (sheetRes.ok) {
        status.textContent = "Data submitted successfully!";
        form.reset();
        setTimeout(() => {
            window.location.href = "members.html";
        }, 1000);
    } else {
        status.textContent = "Failed to save data!";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
    }
});
</script>

</body>
</html>
